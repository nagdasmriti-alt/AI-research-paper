const TG=['Search window opens','Evidence published to date','Evidence published to date','Evidence published to date','Evidence published to date','Evidence published to date','Evidence published to date','Evidence published to date','This paper: pooled estimate','This paper: by outcome','This paper: AI vs automation','This paper: bias and limits','This paper: implications'];
const TT=['The search window opens','A first estimate, on robots','Robots in US regions','AI enters the models','Three large studies','Employment shares and AI exposure','Polarisation, tasks and firms','The year of 130 estimates','The pooled estimate','Outcome by outcome','AI versus automation','Bias and limits','What it means'];

const S=[
[[`This story is told through a single paper: a meta-analysis that pools 321 estimates from 19 empirical studies on how artificial intelligence and automation exposure relate to employment, wages and skill demand${fn(1)}. Its search covers research published from 2015 to 2025, the period in which, the authors say, AI gained prominence in economics and empirical research${fn(1)}${fn(23)}.`,`The dashboard starts empty. No included study appeared in 2015, and the earliest in the dataset is from 2018. As each study enters the timeline, its estimates and effect size are added to the record.`],[['What is a PCC?','The authors convert regression coefficients into partial correlation coefficients (PCC = t/√(t²+df)) so that studies with different units fit on one scale from −1 to 1. A positive PCC means greater AI or automation exposure goes with higher employment, wages or skill demand; a negative PCC means the opposite.'+fn(1)],['The debate they start from','Some researchers argue AI reduces labour demand by replacing tasks and widening skill gaps; others argue it can raise productivity and change the structure of jobs without eliminating labour demand. The authors call the literature controversial and note it differs in datasets, definitions of exposure, models and outcomes.'+fn(1)]]],
[[`Carbonero, Ernst and Weber study industrial robots with panel data on countries and industries from 2005 to 2014, instrumenting robot adoption with an index of robots' technical progress${fn(2)}. They find robot stocks have a statistically significant negative effect on employment at the global level${fn(1)}.`,`Over the sample period, the estimates imply robot adoption reduced global employment by about 1.3% cumulatively. The effect is small in developed economies (about −0.54%) but reaches −14% in emerging economies${fn(1)}. In the pooled plot this study (12 estimates) sits at a PCC of −0.12.`],[['How to read those percentages','The authors derive the cumulative effects by applying the estimated robot elasticities to the observed growth in the robot stock. They describe the sample period; they are not forecasts.'+fn(1)]]],
[[`Leigh, Kraft and Lee examine robots and skill demand in US regional manufacturing${fn(3)}. According to the paper, most robot indicators have no statistically significant effect on manufacturing employment growth, and only one has a small positive effect of about 0.2%${fn(1)}.`,`Their six estimates plot at a PCC of 0.10 [0.06, 0.14], one of the few clearly positive entries. The dot is positive, but the authors' own reading is that evidence for positive employment effects from robots is thin.`],[]],
[[`Two studies in 2021 add AI-specific measures. Georgieff and Hyee use cross-country OECD data on employment and AI exposure, with 20 estimates${fn(4)}. Xie and co-authors ask whether AI adoption changes the pattern of skill demand in Chinese manufacturing firms, with 15 estimates${fn(5)}.`,`Both plot close to zero (0.04 and 0.00). By the end of 2021 the record holds 53 estimates from four studies, and the direction of the evidence is not yet clear.`],[]],
[[`2022 brings three large studies and 90 estimates. Acemoglu and colleagues use online vacancy data: establishments exposed to AI hire more people with AI skills and fewer without, but the authors find no evidence that AI exposure influences employment or wage growth at occupation or industry level${fn(6)}. Their 48 estimates sit at 0.00.`,`Brambilla and co-authors study young workers in Chile: as technology adoption rises the share of routine occupations falls, and the skills PCC is −0.23. Unemployment rises for some groups, mainly the young, without wage losses${fn(7)}. Yashiro and co-authors (Finland, automation risk) add another near-zero result${fn(8)}. The record now holds 143 estimates from seven studies.`],[]],
[[`Albanesi and co-authors find that employment shares have risen in European occupations with greater AI exposure, especially occupations with younger, skilled workers. They find no evidence that exposure has significantly affected wages${fn(9)}. Their 12 estimates sit at a PCC of 0.01.`,`Only one study is added this year, so the record moves slowly: 155 estimates from eight studies.`],[]],
[[`Lábaj and Vitáloš find that in advanced European countries technological change polarises the labour market: newly created jobs suit high- and low-skilled workers better than middle-skilled ones. For Europe as a whole the estimated skill-demand effects are close to zero in most cases (PCC 0.04)${fn(10)}. Cnossen, using worker-level data, finds that non-routine abstract and interactive tasks carry wage premiums while routine tasks carry penalties, with returns varying by exposure to computers, robots and AI${fn(11)}.`,`Wang studies 3,522 Chinese manufacturing firms from 2007 to 2021. AI adoption has a significant negative relationship with employment (coefficients between −0.34 and −0.88 across specifications) and a positive effect on wages${fn(12)}. In the plots that is −0.43 for employment and 0.24 for wages, the most extreme employment estimate in the dataset. The record reaches 191 estimates from 11 studies.`],[['Earlier syntheses','Zehir and Mayaer (2024) pooled 18 studies on AI and robotics and found a slight, statistically insignificant negative effect on total employment, alongside a shift in skill demand away from routine manual work towards social and emotional skills.'+fn(22)]]],
[[`2025 contributes 130 of the 321 estimates, from eight studies. The largest contributor in the whole dataset is Storm, Gonschor and Schmidt on Germany, with 84 estimates at a PCC of 0.00${fn(20)}. Others cover South Korea${fn(18)}, Chinese listed companies (AI development reduced the number of low-skill workers, with digital transformation and human capital investment as mediators)${fn(15)}, the UK${fn(14)}, US job postings${fn(16)}, US firms${fn(17)} and Thai tourism enterprises using service robots${fn(19)}.`,`The largest single effect belongs to Assogbavi and co-authors: a survey of 217 people in Mauritius, PCC 0.32 [0.25, 0.38]. It measures perceived employability, not jobs or wages, so the paper reads it as complementarity at the level of skills and careers, not structural change${fn(13)}. The record is now complete: 19 studies, 321 estimates, 13 settings.`],[['Evidence from the UK','Lábaj and co-authors find robot automation mainly affects middle-income workers and those with low education, while the effect of AI exposure grows with income percentiles and is stronger among higher-education workers.'+fn(14)],['Not in the dataset','Engberg and co-authors (Germany) find that AI-exposed occupations differ from robot-exposed occupations in tasks and skills, with generally positive wage effects from AI exposure. The paper cites it in its literature review.'+fn(24)]]],
[[`The paper was received on 3 June 2026 and published online on 30 July 2026${fn(1)}. It pools all 321 estimates with a three-level random-effects model, which accounts for estimates being nested within studies, and uses cluster-robust standard errors clustered by study.`,`The pooled effect is 0.0059 (SE 0.0168, p = 0.726): small and statistically insignificant. The forest plot reads 0.01 [−0.03, 0.04]. Yet individual studies range from −0.12 to 0.32. The authors' point is that the average is near zero not because estimates agree, but because positive and negative effects of comparable size coexist${fn(1)}.`],[['How the 19 studies were found','1,678 records came from four databases (ScienceDirect 1,413; Web of Science 185; EBSCOhost 70; Google Scholar 10). After removing 50 duplicates and 1,466 records lacking keywords, 162 were screened, and 35 full texts were assessed. With 40 papers from grey literature and snowballing, 75 reports were considered. 56 were excluded (29 without regression, 24 not comparable, 3 with missing data), leaving 19.'+fn(1)],['Heterogeneity','Between-study variance is 0.0044 (τ = 0.067) and within-study variance is 0.0059 (τ = 0.077), both large compared with the pooled estimate. The dispersion of study estimates exceeds the pooled estimate itself.'+fn(1)]]],
[[`Splitting by outcome changes the picture very little. For employment (144 estimates, 12 studies) the pooled effect is −0.0079 (p = 0.868). For wages (88 estimates, 7 studies) it is 0.0437 (p = 0.256). For skills (89 estimates, 8 studies) it is −0.0234 (p = 0.437). None is statistically significant${fn(1)}.`,`The spread within each outcome is wide. Employment runs from Wang's −0.43 to Assogbavi's 0.32. Wages run from Lábaj and co-authors' −0.04 to Wang's 0.24. Skills run from Brambilla's −0.23 to Lábaj and Vitáloš's 0.04. Use the selector in the dashboard to switch the strip between outcomes.`],[['Two mechanisms','The paper reads the evidence as two co-existing mechanisms: employment reductions from automation displacing routine tasks and occupations, and positive effects through productivity, wage upgrading and complementarity between workers and new technology. Together they cancel out in the aggregate.'+fn(1)]]],
[[`Is AI different from other automation? The authors code each study's exposure measure as AI-specific or broader automation and test whether the two differ. They do not. Compared with automation measures, AI measures differ by 0.0507 on employment (p = 0.293), −0.0210 on wages (p = 0.426) and 0.0021 on skills (p = 0.775)${fn(1)}.`,`A wider meta-regression adds outcome category, technology type and publication year as moderators. None explains the differences between studies: the observable study characteristics cannot account for the heterogeneity in the literature${fn(1)}.`],[]],
[[`The authors check for publication bias with a funnel plot and a FAT-PET regression. The funnel plot shows no visible asymmetry. The bias-adjusted effect is 0.0154 (p = 0.435) and the small-study term is −0.2920 (p = 0.682), neither significant, so they find no sign of publication bias or small-study effects${fn(1)}.`,`They also list limits. The number of studies is small, so the power of moderator analyses is low. The contexts, data sources and exposure measures differ a lot. And the outcomes differ across studies. They note a common recommendation of at least 10 papers for a precise meta-analysis, which 19 meets, and that earlier syntheses used 18 and 19${fn(21)}.`],[['What the data cannot tell you','The dataset of extracted estimates is available from the corresponding author on request. The paper does not forecast future job losses or gains, and nothing here is modelled.'+fn(1)]]],
[[`Because the average effect is close to zero while variation across studies is large, the authors argue firms should not treat AI and automation as a technology that, on average, destroys or creates jobs. The more useful unit of analysis is the firm's own context: which tasks are exposed, how existing skills complement or substitute for the technology, and which institutional constraints apply${fn(1)}.`,`Where adoption is paired with reskilling and task redesign towards complementary, non-routine work, the evidence is more consistent with skill upgrading and wage gains. Where the technology is introduced mainly to substitute for routine labour, displacement becomes more likely. For policymakers, the paper cautions against one-size-fits-all rules and favours strengthening reskilling access, support for worker transitions and monitoring${fn(1)}.`],[]]];

 const pl=(fn2,cls,w)=>{const pts=yrs.map(t=>{const c=ST.filter(s=>s.y<=t);return X(t)+','+(54-fn2(c)*50)}).join(' ');ch+=`<polyline fill="none" stroke="${cls}" stroke-width="${w}" points="${pts}"/>`;return pts.split(' ').pop().split(',')};

 // donut: estimates by domain

 const arc=(v,col)=>{const l=K?v/K*C:0,r=`<circle cx="50" cy="50" r="34" fill="none" stroke="${col}" stroke-width="13" stroke-dasharray="${l} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return r};
